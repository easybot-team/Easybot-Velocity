plugins {
    id 'java'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id("xyz.jpenilla.run-velocity") version "3.0.2"

    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'org.lby123165'
version = '1.3.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "Jitpack"
        url = "https://www.jitpack.io"
    }
    maven {
        name = "GeyserMC"
        url = "https://repo.opencollab.dev/main/"
    }
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    annotationProcessor("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")

    implementation('com.github.easybot-team:easybot-bridge:1.7.1') {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'org.projectlombok', module: 'lombok'
    }

    compileOnly("io.github.4drian3d:authmevelocity-api-velocity:4.3.0")
    compileOnly('org.geysermc.geyser:api:2.10.0-SNAPSHOT')
    compileOnly('org.geysermc.floodgate:api:2.2.5-SNAPSHOT')
    compileOnly(fileTree('libs'))

    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
}

tasks {
    runVelocity {
        velocityVersion("3.4.0-SNAPSHOT")
    }

    shadowJar {
        relocate 'org.java_websocket', 'org.lby123165.libs.websocket'

        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'

        archiveClassifier.set('')
    }

    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = [
            'version': project.version
    ]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

project.idea.project.settings.taskTriggers.afterSync generateTemplates
project.eclipse.synchronizationTasks(generateTemplates)
